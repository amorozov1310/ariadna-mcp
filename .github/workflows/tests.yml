name: Тесты

# Быстрые тесты (см. CLAUDE.md): не зависят от data/ — собирают индекс из
# tests/fixtures во временном каталоге. Не запускаем `-m slow` — те тесты
# требуют реальных корпусов заказчика (data/projects/), которых в этом
# репозитории нет и не будет (см. .gitignore).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Разработка идёт на Windows: там иначе ведут себя открытые файлы (занятый
  # index.db не удалить), кодировки и пути — поэтому быстрые тесты и на ней.
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - run: python -m pytest tests -q

      # scripts/live_check.py против python -m src.main, поднятого в тесте на
      # свободных портах (маркер live — в быстрые тесты не входит).
      - run: python -m pytest tests -q -m live

  # Docker-образ целиком: сборка как у пользователя (колёса → compose up),
  # затем scripts/live_check.py по сети в полном режиме — регрессия, гонки
  # удаления, playground против MCP, стресс реестра, лог контейнера.
  docker-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Колёса для офлайн-сборки образа (как в README)
        run: docker run --rm -v "$PWD:/repo" -w /repo python:3.12-slim sh docker-wheels/fetch.sh

      - name: docker compose up с пустым data/
        run: |
          mkdir -p data
          docker compose up -d --build

      - name: Дождаться /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19878/health && exit 0
            sleep 2
          done
          echo "Сервер не ответил на /health за 120 с"
          exit 1

      - name: live_check (полный режим)
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/live_check.py --docker-container ariadna

      - name: Лог контейнера
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v

  # Запуск без Docker на Windows (режим разработки): здесь видны ошибки,
  # которых нет в Linux-контейнере, — занятые файлы при удалении проекта,
  # запись реестра, шум ProactorEventLoop в логе.
  native-windows-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: python -m src.main в фоне и live_check --quick
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'ariadna-data'
          $env:WEB_PORT = '29878'
          $env:MCP_HTTP_PORT = '29879'
          $out = Join-Path $env:RUNNER_TEMP 'server.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'server.err.log'
          $server = Start-Process python -ArgumentList '-m', 'src.main' -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:29878/health).StatusCode -eq 200) { $up = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          $code = 2
          if ($up) {
            python scripts/live_check.py --quick --web http://127.0.0.1:29878 --mcp http://127.0.0.1:29879/mcp
            $code = $LASTEXITCODE
          } else {
            Write-Host "Сервер не ответил на /health за 120 с"
          }
          Stop-Process -Id $server.Id -Force
          Start-Sleep -Seconds 1
          $log = (Get-Content $out, $err -Raw -ErrorAction SilentlyContinue) -join "`n"
          # Лог сервера без Docker: ни одной трассировки и строки ERROR.
          $bad = $log -split "`n" | Where-Object { $_ -match 'Traceback' -or $_ -match '(^|\s)ERROR(:|\s)' }
          if ($code -ne 0 -or $bad) {
            Write-Host "---- лог сервера ----"
            Write-Host $log
          }
          if ($bad) { Write-Host "В логе сервера ошибки:"; $bad | ForEach-Object { Write-Host $_ }; if ($code -eq 0) { $code = 1 } }
          exit $code

  # Устанавливаемый пакет: колесо, поставленное не editable в чистое
  # окружение, должно импортироваться и находить свои не-.py файлы
  # (VERSION, шаблоны и статику Web UI) — раньше автопоиск setuptools собирал
  # колесо без пакета src и без этих файлов.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать колесо
        run: pip wheel --no-deps . -w dist

      - name: Установить в чистое окружение
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl httpx

      - name: Проверить установленный пакет вне репозитория
        env:
          EXPECTED_VERSION_FILE: ${{ github.workspace }}/src/VERSION
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python -c "import src, src.main, src.web.app, src.mcp_server.tools, src.core.indexer; print(src.__version__)"
          DATA_DIR=$(mktemp -d) /tmp/wheel-venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import src
          assert 'site-packages' in src.__file__, src.__file__
          expected = Path(os.environ['EXPECTED_VERSION_FILE']).read_text().strip()
          assert src.__version__ == expected, (src.__version__, expected)
          from fastapi.testclient import TestClient
          from src.web.app import app
          client = TestClient(app, headers={'Host': '127.0.0.1:19878'})
          for path in ('/', '/static/style.css', '/static/fonts/golos-text-400-cyrillic.woff2'):
              r = client.get(path)
              assert r.status_code == 200, (path, r.status_code, r.text[:300])
          # Разрешённый IPv6-адрес с портом: со Starlette < 1.7 здесь был 400.
          r = TestClient(app, headers={'Host': '[::1]:19878'}).get('/health')
          assert r.status_code == 200, ('[::1]', r.status_code)
          print('Web UI из установленного пакета: шаблоны и статика на месте')
          PY
          /tmp/wheel-venv/bin/ariadna-index --help
