<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Нить Ариадны: спираль, выводящая из лабиринта наружу. Читается и
    в 16 пикселях — линии редкие и одной толщины, засечек и мелких
    деталей нет. Янтарная нить на петроле — те же два цвета, что и в
    палитре интерфейса.
  -->
  <rect width="32" height="32" rx="8" fill="#0f766e"/>
  <path d="M16 20.5a4.5 4.5 0 1 0-4.5-4.5v0A8.5 8.5 0 1 0 24.5 16"
        fill="none" stroke="#FBBF24" stroke-width="2.6"
        stroke-linecap="round"/>
  <circle cx="16" cy="16" r="1.6" fill="#fff"/>
</svg>
